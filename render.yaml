# =============================================================================
# Render Blueprint — Café Nelo
# =============================================================================
# One web service (Flask API + built Vite SPA served from client/dist) and one
# managed Postgres database. Apply it from the Render dashboard:
#   New + -> Blueprint -> pick jsoto007/cafe-nelo -> Apply.
#
# Secrets are deliberately NOT declared here so the Blueprint applies without
# prompting. Add them afterwards under the service's Environment tab:
#
#   First admin login (or run `flask --app wsgi create-admin` in the Shell tab):
#     ADMIN_BOOTSTRAP_EMAIL / ADMIN_BOOTSTRAP_PASSWORD / ADMIN_BOOTSTRAP_NAME
#   Reservation emails:
#     MAILGUN_DOMAIN / MAILGUN_API_KEY / MAILGUN_FROM
#   Optional (uploads fall back to database storage when unset):
#     R2_BUCKET, R2_ENDPOINT_URL, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#     R2_PUBLIC_BASE_URL
#
# SECRET_KEY / IDENTITY_ENCRYPTION_KEY are generated once by Render. Do not
# rotate IDENTITY_ENCRYPTION_KEY casually: it decrypts stored guest identity
# fields, and a new value makes existing encrypted rows unreadable.
# =============================================================================

databases:
  - name: cafe-nelo-db
    databaseName: cafe_nelo
    user: cafe_nelo
    region: oregon
    # `free` Postgres instances are deleted 30 days after creation, which is
    # what took the previous database down. basic-256mb is the smallest
    # persistent tier.
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: cafe-nelo
    runtime: python
    region: oregon
    plan: starter
    rootDir: .
    autoDeploy: true
    buildCommand: npm ci --prefix client && npm run build --prefix client && pip install -r server/requirements.txt
    # db-bootstrap creates the schema on an empty database (the migration chain
    # cannot run from scratch) and applies pending migrations otherwise.
    # ensure-bootstrap-admin is a no-op when ADMIN_BOOTSTRAP_* are unset.
    # seed-if-empty loads the menu/specials/services once and records it in
    # system_settings, so later deploys never overwrite admin-entered content.
    startCommand: cd server && flask --app wsgi db-bootstrap && flask --app wsgi ensure-bootstrap-admin && flask --app wsgi seed-if-empty && exec gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2} --timeout 120
    # Returns 200 only when the database schema is reachable, so a broken boot
    # never replaces a healthy instance.
    healthCheckPath: /api/payments/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: NODE_VERSION
        value: 22.14.0
      - key: FLASK_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: cafe-nelo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: IDENTITY_ENCRYPTION_KEY
        generateValue: true
      # The SPA is served by this same service, so these are the service's own
      # public origin. Update both when a custom domain (e.g. cafenelo.com) is
      # attached.
      - key: CORS_ORIGINS
        value: https://cafe-nelo.onrender.com
      - key: CLIENT_BASE_URL
        value: https://cafe-nelo.onrender.com
      - key: BRAND_NAME
        value: Café Nelo
      - key: INTERNAL_BOOKING_NOTIFICATION_EMAIL
        value: reservations@cafenelo.com
